name: phonenumber_ae
description: >-
  Validate and format international phone numbers. A thin dart:ffi binding over
  the shared libphonenumber native engine — no phone-number logic lives in Dart.
version: 0.1.0
repository: https://github.com/google/libphonenumber

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.24.0
